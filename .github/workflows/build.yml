name: Build Dual Edge TTS APK
​on:
workflow_dispatch:
push:
branches:
- main
- master
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
​- name: Setup Android SDK
uses: android-actions/setup-android@v3
​- name: Setup Gradle
uses: gradle/actions/setup-gradle@v3
with:
gradle-version: '8.5'
​- name: Generate Android Project
run: |
mkdir -p app/src/main/java/com/example/dualedge
mkdir -p app/src/main/res/values
​# settings.gradle
cat << 'EOF' > settings.gradle
rootProject.name = "DualEdgeTTS"
include ':app'
EOF
​# root build.gradle
cat << 'EOF' > build.gradle
buildscript {
repositories {
google()
mavenCentral()
}
dependencies {
classpath 'com.android.tools.build:gradle:8.2.2'
}
}
allprojects {
repositories {
google()
mavenCentral()
}
}
EOF
​# app/build.gradle
cat << 'EOF' > app/build.gradle
apply plugin: 'com.android.application'
​android {
namespace 'com.example.dualedge'
compileSdkVersion 34
​defaultConfig {
applicationId "com.example.dualedge"
minSdkVersion 26
targetSdkVersion 34
versionCode 1
versionName "1.0"
}
​compileOptions {
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}
}
​dependencies {
implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
EOF
​# AndroidManifest.xml
cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
​<uses-permission android:name="android.permission.INTERNET" />
​<application
android:label="Dual Edge TTS (RU/DE)"
android:supportsRtl="true">
​<service
android:name=".DualTtsService"
android:label="Dual Edge TTS (RU/DE)"
android:exported="true">
<intent-filter>
<action android:name="android.intent.action.TTS_SERVICE" />
<category android:name="android.intent.category.DEFAULT" />
</intent-filter>
</service>
​<activity
android:name=".MainActivity"
android:exported="true">
<intent-filter>
<action android:name="android.intent.action.MAIN" />
<category android:name="android.intent.category.LAUNCHER" />
</intent-filter>
</activity>
</application>
</manifest>
EOF
​# MainActivity.java
cat << 'EOF' > app/src/main/java/com/example/dualedge/MainActivity.java
package com.example.dualedge;
​import android.app.Activity;
import android.content.Intent;
import android.os.Bundle;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;
​public class MainActivity extends Activity {
@Override
protected void onCreate(Bundle savedInstanceState) {
super.onCreate(savedInstanceState);
LinearLayout layout = new LinearLayout(this);
layout.setOrientation(LinearLayout.VERTICAL);
layout.setPadding(60, 100, 60, 60);
​TextView tv = new TextView(this);
tv.setText("Dual Edge TTS (RU / DE)\n\n• Русский язык: Dmitry (Microsoft Neural)\n• Немецкий язык: Conrad (Microsoft Neural)\n\nНажмите кнопку ниже для перехода в настройки синтеза речи:");
tv.setTextSize(16);
layout.addView(tv);
​Button btn = new Button(this);
btn.setText("Выбрать Dual Edge TTS в системе");
btn.setOnClickListener(v -> {
Intent intent = new Intent();
intent.setAction("com.android.settings.TTS_SETTINGS");
intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
startActivity(intent);
});
layout.addView(btn);
​setContentView(layout);
}
}
EOF
​# DualTtsService.java
cat << 'EOF' > app/src/main/java/com/example/dualedge/DualTtsService.java
package com.example.dualedge;
​import android.media.AudioFormat;
import android.media.MediaCodec;
import android.media.MediaExtractor;
import android.media.MediaFormat;
import android.speech.tts.SynthesisCallback;
import android.speech.tts.SynthesisRequest;
import android.speech.tts.TextToSpeech;
import android.speech.tts.TextToSpeechService;
import okhttp3.*;
import okio.ByteString;
​import java.io.File;
import java.io.FileOutputStream;
import java.nio.ByteBuffer;
import java.util.Locale;
import java.util.UUID;
import java.util.concurrent.CountDownLatch;
import java.util.concurrent.TimeUnit;
​public class DualTtsService extends TextToSpeechService {
​private final OkHttpClient client = new OkHttpClient.Builder()
.readTimeout(15, TimeUnit.SECONDS)
.build();
​@Override
protected int onIsLanguageAvailable(String lang, String country, String variant) {
if (lang == null) return TextToSpeech.LANG_NOT_SUPPORTED;
String l = lang.toLowerCase(Locale.ROOT);
if (l.startsWith("ru") || l.startsWith("de")) {
return TextToSpeech.LANG_COUNTRY_AVAILABLE;
}
return TextToSpeech.LANG_NOT_SUPPORTED;
}
​@Override
protected String[] onGetLanguage() {
return new String[]{"deu", "DEU", ""};
}
​@Override
protected int onLoadLanguage(String lang, String country, String variant) {
return onIsLanguageAvailable(lang, country, variant);
}
​@Override
protected void onStop() {}
​@Override
protected void onSynthesizeText(SynthesisRequest request, SynthesisCallback callback) {
CharSequence charSeq = request.getCharSequenceText();
if (charSeq == null) return;
String text = charSeq.toString().trim();
if (text.isEmpty()) return;
​boolean hasCyrillic = false;
for (char c : text.toCharArray()) {
if (Character.UnicodeBlock.of(c) == Character.UnicodeBlock.CYRILLIC) {
hasCyrillic = true;
break;
}
}
​String voice = hasCyrillic ? "ru-RU-DmitryNeural" : "de-DE-ConradNeural";
String lang = hasCyrillic ? "ru-RU" : "de-DE";
​try {
byte[] mp3Data = fetchEdgeTtsAudio(text, voice, lang);
if (mp3Data == null || mp3Data.length == 0) {
callback.error();
return;
}
decodeAndPlay(mp3Data, callback);
} catch (Exception e) {
callback.error();
}
}
​private byte[] fetchEdgeTtsAudio(String text, String voice, String lang) throws Exception {
String connId = UUID.randomUUID().toString().replace("-", "");
String url = "wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4EAFF4E9FB37E23D68491D6F4&ConnectionId=" + connId;
​final java.io.ByteArrayOutputStream audioBuffer = new java.io.ByteArrayOutputStream();
final CountDownLatch latch = new CountDownLatch(1);
​Request req = new Request.Builder()
.url(url)
.addHeader("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0")
.addHeader("Origin", "chrome-extension://jdiccldimpdaibmpdkjnbmckianbfold")
.build();
​String safeText = text.replace("&", "&").replace("<", "<").replace(">", ">");
​WebSocket ws = client.newWebSocket(req, new WebSocketListener() {
@Override
public void onOpen(WebSocket webSocket, Response response) {
String timestamp = String.valueOf(System.currentTimeMillis());
String config = "X-Timestamp:" + timestamp + "\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n" +
"{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"false"}," +
""outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}";
webSocket.send(config);
​String reqId = UUID.randomUUID().toString().replace("-", "");
String ssml = "X-RequestId:" + reqId + "\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:" + timestamp + "Z\r\nPath:ssml\r\n\r\n" +
"<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='" + lang + "'>" +
"<voice name='" + voice + "'>" + safeText + "</voice></speak>";
webSocket.send(ssml);
}
​@Override
public void onMessage(WebSocket webSocket, ByteString bytes) {
byte[] raw = bytes.toByteArray();
if (raw.length > 2) {
int headerLen = ((raw[0] & 0xFF) << 8) | (raw[1] & 0xFF);
int audioOffset = headerLen + 2;
if (raw.length > audioOffset) {
audioBuffer.write(raw, audioOffset, raw.length - audioOffset);
}
}
}
​@Override
public void onMessage(WebSocket webSocket, String textMsg) {
if (textMsg.contains("Path:turn.end")) {
webSocket.close(1000, "Done");
latch.countDown();
}
}
​@Override
public void onFailure(WebSocket webSocket, Throwable t, Response response) {
latch.countDown();
}
});
​latch.await(12, TimeUnit.SECONDS);
return audioBuffer.toByteArray();
}
​private void decodeAndPlay(byte[] mp3Bytes, SynthesisCallback callback) throws Exception {
File tempFile = File.createTempFile("tts_audio", ".mp3", getCacheDir());
try (FileOutputStream fos = new FileOutputStream(tempFile)) {
fos.write(mp3Bytes);
}
​MediaExtractor extractor = new MediaExtractor();
extractor.setDataSource(tempFile.getAbsolutePath());
extractor.selectTrack(0);
​MediaFormat format = extractor.getTrackFormat(0);
int sampleRate = format.getInteger(MediaFormat.KEY_SAMPLE_RATE);
int channelCount = format.getInteger(MediaFormat.KEY_CHANNEL_COUNT);
​MediaCodec decoder = MediaCodec.createDecoderByType(format.getString(MediaFormat.KEY_MIME));
decoder.configure(format, null, null, 0);
decoder.start();
​callback.start(sampleRate, AudioFormat.ENCODING_PCM_16BIT, channelCount);
MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
​boolean isEOS = false;
while (!Thread.interrupted()) {
if (!isEOS) {
int inIndex = decoder.dequeueInputBuffer(10000);
if (inIndex >= 0) {
ByteBuffer buffer = decoder.getInputBuffer(inIndex);
if (buffer != null) {
int sampleSize = extractor.readSampleData(buffer, 0);
if (sampleSize < 0) {
decoder.queueInputBuffer(inIndex, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM);
isEOS = true;
} else {
decoder.queueInputBuffer(inIndex, 0, sampleSize, extractor.getSampleTime(), 0);
extractor.advance();
}
}
}
}
​int outIndex = decoder.dequeueOutputBuffer(info, 10000);
if (outIndex >= 0) {
ByteBuffer outBuf = decoder.getOutputBuffer(outIndex);
if (outBuf != null) {
byte[] chunk = new byte[info.size];
outBuf.get(chunk);
if (chunk.length > 0) {
callback.audioAvailable(chunk, 0, chunk.length);
}
}
decoder.releaseOutputBuffer(outIndex, false);
if ((info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break;
}
}
​decoder.stop();
decoder.release();
extractor.release();
tempFile.delete();
callback.done();
}
}
EOF
​- name: Build APK with Gradle
run: gradle assembleDebug --stacktrace
​- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: Dual-Edge-TTS-APK
path: app/build/outputs/apk/debug/*.apk
