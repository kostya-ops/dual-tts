STREAMING_CHUNK:Configuring workflow trigger and runner environment...
name: Build Dual Edge TTS APK
on:
workflow_dispatch:
push:
branches:
- main
- master
jobs:
build:
runs-on: ubuntu-latest
steps:
# STREAMING_CHUNK:Setting up repository and Java build environment...
- name: Checkout repository
uses: actions/checkout@v4
- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
# STREAMING_CHUNK:Configuring Android SDK and build tools...
- name: Setup Android SDK
uses: android-actions/setup-android@v3
- name: Setup Gradle
uses: gradle/actions/setup-gradle@v3
# STREAMING_CHUNK:Compiling APK release binary...
- name: Build APK with Gradle
run: |
if [ ! -f "./gradlew" ]; then
gradle wrapper
fi
chmod +x ./gradlew
./gradlew assembleRelease --stacktrace
# STREAMING_CHUNK:Uploading generated APK artifacts...
- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: Dual-Edge-TTS-Release
path: 'app/build/outputs/apk//*.apk'
